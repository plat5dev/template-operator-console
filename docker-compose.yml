# The staff console, in development: Vite on :5412, reloading as you edit. plat5
# start runs it (the project's docker-compose.yml includes this file) and passes
# where the operator gateway and staff sign-in are. The production image is the
# Dockerfile's last stage.
services:
  console:
    build:
      context: .
      target: dev
    labels:
      service.name: console
      service.namespace: console
    ports:
      - "5412:5412"
    environment:
      VITE_GATEWAY_URL: ${PLAT5_OPERATOR_URL:-http://localhost:5410}
      VITE_AUTH_ISSUER: ${PLAT5_STAFF_AUTH_URL:-http://localhost:5411}
      VITE_AUTH_CLIENT_ID: ${PLAT5_STAFF_CLIENT_ID:-operator-console}
    volumes:
      - .:/app
      - console_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:5412/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

volumes:
  console_node_modules:
