# plat5 init copies this app into a project's console/ folder: the staff console,
# a client of the operator gateway.
name: console
kind: console
description: Vite + React staff console for the operator gateway (orgs, people, audit)

# plat5 start runs it from this compose file. Its origin may sign in with staff Auth
# and call the operator gateway.
app:
  compose: docker-compose.yml
  web: http://localhost:5412

exclude:
  - .github
  - AGENTS.md
