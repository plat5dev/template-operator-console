# plat5 init copies this app into a project's operator-console/ folder: your operators'
# console, a client of the operator gateway.
name: operator-console
kind: operator-console
description: Vite + React console for your operators, on the operator gateway (the tree, people, tasks, audit)

# This compose file runs it alone, on :5412. Its origin may sign in with the operator
# IdP and call the operator gateway.
app:
  compose: docker-compose.yml
  web: http://localhost:5412

exclude:
  - .github
  - AGENTS.md
